Tags:
- AmdTools64.sys
Verified: 'TRUE'
Author: Leonid (methmind), Michael Haag
Created: '2026-09-18'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: ''
  Description: AMD Special Tools Driver AmdTools64.sys versions 1.7.16.218 and 1.7.16.219
    expose physical-memory mapping through IOCTL 0xFFF028A4. Static inspection of both samples
    shows caller-supplied physical addresses and lengths reaching MmMapIoSpace and user-mode
    MDL mappings without a physical-range authorization check. The device security descriptor
    restricts access to LocalSystem and Builtin Administrators. The PnP device interface must
    be installed and started before use. The 1.7.16.218 submission includes a screenshot of
    a SYSTEM shell reported from an isolated VM; that runtime result was not independently
    reproduced. No affected-version range is asserted.
  Usecase: Map physical memory into user mode across the administrator-to-kernel boundary.
  Privileges: Administrator or LocalSystem with access to the started PnP device.
  OperatingSystem: Windows
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/430
- https://github.com/methmind/amdtools64
- https://github.com/magicsword-io/LOLDrivers/pull/473
- https://github.com/CatCaller/AMDTools
