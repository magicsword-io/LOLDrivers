MitreID: T1562.001
Category: vulnerable driver
Commands:
  Command: ''
  Description: kgameprotect.sys exposes FILE_ANY_ACCESS IOCTL 0x222048 through \\.\kgameprotect.
    The handler accepts a caller-selected PID and opens that process from KernelMode
    with PROCESS_TERMINATE before calling ZwTerminateProcess. It performs no caller,
    registered-client, or target-PID authorization on this IOCTL branch. The reviewed
    sample is version 2.7.1.7 and also registers a file-system minifilter, so correct
    minifilter installation is required. Static review confirms the process-termination
    path, but does not establish that unprivileged users can open the device or that
    protected processes can be terminated on every Windows configuration.
  Usecase: Terminate selected non-PPL processes to cause denial of service or impair
    security controls.
  Privileges: Administrator to load; potentially unprivileged to trigger if the applied
    device DACL permits opening the control device.
  OperatingSystem: Windows 10, Windows 11 (x64)
Resources:
