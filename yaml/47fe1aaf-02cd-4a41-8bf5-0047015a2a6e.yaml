Id: 47fe1aaf-02cd-4a41-8bf5-0047015a2a6e
Tags:
- phymem64.sys
- phymem.sys
Verified: 'TRUE'
Author: Michael Haag
Created: '2023-01-09'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create phymem64.sys binPath=C:\windows\temp\phymem64.sys type=kernel
    && sc.exe start phymem64.sys
  Description: Supermicro phymem drivers expose direct physical-memory operations
    to user mode. In the tracked 2.3.0.0 build, IOCTL 0x80002000 accepts a physical
    address and length, maps the range with MmMapIoSpace, builds an MDL, and maps
    the pages to user mode with MmMapLockedPagesSpecifyCache; 0x80002004 releases
    the mapping. Adjacent paths provide direct physical-memory reads and port I/O.
    An administrator with device access can use these primitives to inspect or modify
    kernel state.
  OperatingSystem: Windows 10
  Privileges: Administrator
  Usecase: Read and write physical memory
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
- https://github.com/fluffycats31/vulnerable-drivers
- https://github.com/eclypsium/Screwed-Drivers/blob/master/DRIVERS.md
