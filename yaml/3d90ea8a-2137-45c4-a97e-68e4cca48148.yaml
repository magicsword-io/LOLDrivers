Category: vulnerable driver
Verified: 'FALSE'
Commands:
  Command: sc.exe create shield binPath= C:\windows\temp\shield.sys type= kernel &&
    sc.exe start shield
  Description: A Local Privilege Escalation (LPE) vulnerability exists in the core kernel driver shield.sys of Horizon DataSys Reboot Restore Standard v13.2. The driver utilizes the legacy IoCreateDevice API to create its device object named \.\EAZShield without specifying restrictive security descriptors (SDDL). Consequently, the device object inherits permissive default Access Control Lists (ACLs), allowing any local authenticated unprivileged user (Standard User) to open a handle to it.When handling IOCTL requests within the dispatch function sub_24394, the driver exposes control code 0x96102014. After passing basic header validations (such as v8[1] == 'DMCw'), the execution path enters sub_23908 to process the sub-control code 0xF0016.
  Usecase: Arbitrary kernel memory read/write from any authenticated user.
    Full system compromise via token theft, privilege escalation, disabling
    security products, ring-0 code execution. Attractive BYOVD target.
  Privileges: Any user can install; device access may be available to
    unprivileged users after installation
  OperatingSystem: Windows 10, Windows 11
