Commands:
  Command: ''
  Description: >-
    Elastic Security Labs reports that RONINGLOADER writes ollama.sys to a
    temporary directory, creates a temporary service to load it, and sends
    target process IDs to the driver to terminate antivirus processes. The
    service is deleted after the termination request. The reported October
    2025 sample uses standard signing procedures and does not contain the
    HookSignTool artifacts identified in earlier related samples.
  Usecase: Terminate antivirus processes through a malicious kernel driver.
  Privileges: >-
    Administrator privileges are required to load the driver; the device's
    caller access requirements have not been independently verified.
  OperatingSystem: Windows
