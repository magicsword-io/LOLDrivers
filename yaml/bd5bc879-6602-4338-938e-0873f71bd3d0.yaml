Commands:
  Command: ''
  Description: Nextron Systems identifies this exact sample as a rootkit combining
    network interception, obfuscated file operations, and security-product targeting.
    Observed and embedded filename metadata identify it as ampg.sys. Static analysis
    confirms WFP filtering and packet-injection paths, XOR-based file transformation,
    and a process-termination routine explicitly invoked for 360Tray.exe and ZhuDongFangYu.exe.
    Its embedded version fields claim Microsoft Corporation and SD Crashdump Port
    Driver; these are file metadata claims, not evidence of Microsoft authorship.
    No runtime test of successful security-product termination was performed.
  Usecase: Intercept network traffic and attempt to terminate named security processes
    from kernel mode.
  Privileges: kernel
  OperatingSystem: Windows x64
