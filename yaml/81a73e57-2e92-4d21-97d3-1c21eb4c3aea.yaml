Id: 81a73e57-2e92-4d21-97d3-1c21eb4c3aea
Tags:
- LenovoDiagnosticsDriver.sys
Verified: 'TRUE'
Author: Michael Haag
Created: '2023-01-09'
MitreID: T1068
CVE:
- CVE-2022-3699
Category: vulnerable driver
Commands:
  Command: sc.exe create LenovoDiagnosticsDriver.sys binPath=C:\windows\temp\LenovoDiagnosticsDriver.sys
    type=kernel && sc.exe start LenovoDiagnosticsDriver.sys
  Description: Lenovo Diagnostics versions before 4.45 are covered by CVE-2022-3699.
    The vulnerable driver behavior tracked here is limited to confirmed 1.0.2.0 through
    1.0.4.0 LenovoDiagnosticsDriver.sys builds. Their low-user device ACL exposes
    FILE_ANY_ACCESS IOCTLs 0x222010 and 0x222014, which map caller-selected physical
    addresses and provide unrestricted physical-memory read and write primitives.
    Later 3.1.0.0 code removed the write path, denied Builtin Users, and limited reads
    to allowlisted PCI registers, so that build is not tracked here.
  OperatingSystem: Windows
  Privileges: User
  Usecase: Elevate privileges
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
- https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
