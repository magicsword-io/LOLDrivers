CVE:
- CVE-2022-26522
- CVE-2022-26523
Category: vulnerable driver
Commands:
  Command: sc.exe create aswArPot.sys binPath=C:\windows\temp\aswArPot.sys type=kernel
    && sc.exe start aswArPot.sys
  Description: Avast and AVG Anti Rootkit driver aswArPot.sys versions before 22.1
    are affected by CVE-2022-26522 and CVE-2022-26523. Double-fetch races in kernel
    handlers allow a non-administrator user to corrupt kernel memory and execute code
    in kernel context, enabling local privilege escalation and security-product bypass.
  OperatingSystem: Windows 10
  Privileges: kernel
  Usecase: Elevate privileges
