Category: vulnerable driver
Commands:
  Command: ''
  Description: The legacy Prevx Scanner driver pxscan.sys 3.0.5.220 processes configurable
    file targets under its service's Files registry key when IOCTL 0x22E044 is requested.
    Static analysis confirms that the worker can delete selected files and terminate
    matching processes from kernel context. The process termination behavior is documented
    as CVE-2025-60349. The reviewed device uses FILE_DEVICE_SECURE_OPEN and a security
    descriptor granting full access only to LocalSystem and Builtin Administrators;
    modifying the service registry configuration also requires appropriate privileges.
    This is an administrator/SYSTEM-gated BYOVD primitive, not a standard-user privilege
    escalation. Protected-process termination was not tested locally.
  Usecase: Delete files and terminate processes to impair security controls.
  Privileges: Administrator or LocalSystem with device access and service-registry
    write access.
  OperatingSystem: Windows
