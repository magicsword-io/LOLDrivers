MitreID: T1068
CVE:
- CVE-2023-47569
- CVE-2023-47570
- CVE-2023-47571
- CVE-2023-47572
- CVE-2024-26314
Category: vulnerable driver
Commands:
  Command: sc.exe create WinDriver type= kernel binPath= C:\\windows\\temp\\windrvr1411.sys
    && sc.exe start WinDriver
  Description: Jungo WinDriver versions 6.0.0 through 16.1.0 are affected by multiple
    kernel security issues fixed in version 16.2.0. The tracked 12.5.1 through 14.1.1
    builds fall inside that affected interval. CVE-2024-26314 allows a low-privileged
    local attacker to escalate privileges and execute arbitrary code. The 14.1.1 driver
    exposes METHOD_NEITHER requests that reach port I/O, PCI configuration, and mapped-resource
    operations after the required WinDriver registration workflow.
  Usecase: Elevate privileges
  Privileges: User
  OperatingSystem: Windows
