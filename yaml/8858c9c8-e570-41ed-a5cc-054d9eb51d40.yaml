Id: 8858c9c8-e570-41ed-a5cc-054d9eb51d40
Tags:
- fekern.sys
- FireEye Realtime Driver
- Trellix HX Agent
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create fekern type= kernel binPath= C:\\windows\\temp\\fekern.sys
    && sc.exe start fekern
  Description: Trellix HX Agent fekern.sys 34.x is affected by CVE-2025-14963. The
    signed FireEye 34.5.0 and 34.8.0 builds tracked here expose the \\Device\\fekern_00
    interface. Used as a standalone BYOVD, the vulnerable driver can provide access
    to LSASS memory and enable local privilege escalation. A fully functioning HX
    Agent restricts access through tamper protection.
  Usecase: Access protected process memory and elevate privileges
  Privileges: Administrator
  OperatingSystem: Windows
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
- https://github.com/fluffycats31/vulnerable-drivers
- https://nvd.nist.gov/vuln/detail/CVE-2025-14963
- https://thrive.trellix.com/s/article/000015100
