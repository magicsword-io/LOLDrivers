Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
CVE:
- CVE-2025-65001
Category: vulnerable driver
Commands:
  Command: sc.exe create FBIOSDRV type= kernel binPath= C:\\windows\\temp\\fbiosdrv.sys
    && sc.exe start FBIOSDRV
  Description: Fujitsu BIOS Driver versions before 2.5.0.0 are affected by CVE-2025-65001.
    The tracked 1.2.1.0 through 2.4.0.0 fBiosDrv.sys builds all precede the fixed
    release. A crafted request from a local authenticated administrator can trigger
    an out-of-bounds write, potentially causing arbitrary kernel code execution or
    denial of service.
  Usecase: Execute code in the kernel
  Privileges: Administrator
  OperatingSystem: Windows
