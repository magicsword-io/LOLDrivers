Verified: 'TRUE'
Commands:
  Command: sc.exe create RtsUpx binPath= C:\windows\temp\RtsUpx.sys type= kernel &&
    sc.exe start RtsUpx
  Description: RtsUpx.sys in Realtek RtsUpx USB Utility Driver for Camera/Hub/Audio
    through 1.14.0.0 allows local low-privileged users to achieve an arbitrary read
    or write operation from/to physical memory (leading to Escalation of Privileges,
    Denial of Service, Code Execution, and Information Disclosure) via a crafted Device
    IO Control packet to a device.
  Usecase: Allows local low-privileged users to achieve an arbitrary read
    or write operation from/to physical memory.
  Privileges: local low-privileged users
  OperatingSystem: Windows 10, Windows 11
