Verified: 'TRUE'
Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
CVE:
- CVE-2024-45181
- CVE-2024-45182
Category: vulnerable driver
Commands:
  Command: sc.exe create WibuKey type= kernel binPath= C:\\windows\\temp\\WibuKey64.sys
    && sc.exe start WibuKey
  Description: WibuKey for Windows releases before 6.70 are affected by CVE-2024-45181
    and CVE-2024-45182. Version 6.70 is separately affected by the boundary-validation
    flaw documented in WIBU-100057 and fixed in 6.71. The tracked 6.40 and 6.50a
    builds fall in the first affected range. In the tracked 6.70 build, subcommand
    0x14 of IOCTL 0x8200E804 combines a caller-controlled offset with an input-buffer
    pointer without validating that the resulting object remains inside the request,
    enabling out-of-bounds kernel access.
  Usecase: Read and corrupt kernel memory
  Privileges: User
  OperatingSystem: Windows
Resources:
