Author: Michael Haag
Created: '2026-09-08'
MitreID: T1014
Category: malicious
Verified: 'TRUE'
Commands:
  Command: ''
  Description: Nextron Systems identifies these samples as MemLoaderCustomize kernel
    PE-loader variants. Capabilities reported across the pair include kernel hooking,
    module hiding, and deletion; module hiding is specifically attributed to the c6825f94
    sample. Static analysis confirms matching loader implementations that allocate
    image memory, copy PE sections, apply relocations, resolve kernel imports, and
    prepare mapped-image execution, together with file-deletion helpers. Both contain
    a MemLoaderCustomize.pdb build path. Module hiding and successful runtime self-deletion
    remain source-reported rather than dynamically tested.
  Usecase: Map executable images into kernel memory outside the normal driver-loading
    path.
  Privileges: kernel
  OperatingSystem: Windows x64
Resources:
- https://github.com/NextronSystems/iocs/blob/89038fb97602153f20dadb9ba7e9fcaeac9af148/reports/whql-signed/readme.md
