CVE:
- CVE-2025-0285
- CVE-2025-0286
- CVE-2025-0287
- CVE-2025-0288
- CVE-2025-0289
Category: vulnerable driver
Verified: 'TRUE'
Commands:
  Command: sc.exe create BioNTdrv.sys binPath=C:\windows\temp\BioNTdrv.sys type=kernel
    && sc.exe start BioNTdrv.sys
  Description: Paragon Hard Disk Manager BioNTdrv.sys versions 10.1.x and older, 1.0.0.0,
    1.1.0.0, 1.3.0.0, 1.4.0.0, and 1.5.1.0 contain five vulnerabilities that expose
    arbitrary kernel-memory mapping, write, and move operations, insecure kernel resource
    access, and a null-pointer dereference. Local attackers can use the affected driver
    to elevate to SYSTEM or cause a denial of service. CVE-2025-0289 has been observed
    in ransomware BYOVD attacks. Version 2.0.0 fixes the flaws.
  Usecase: Elevate privileges
  Privileges: kernel
  OperatingSystem: Windows 10
