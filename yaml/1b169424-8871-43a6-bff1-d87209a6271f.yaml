Commands:
    Command: sc.exe create FileLock binPath=C:\windows\temp\FileLock.sys type=kernel && sc.exe start FileLock
    Description: >-
        FileLock.sys (ESAFENET SmartSec V1.0.240) is a file system minifilter that creates the
        communication port \eFileLockPort with a NULL DACL and accepts every connection. Port
        commands perform ZwCreateFile/ZwReadFile/ZwWriteFile/ZwSetInformationFile from kernel
        mode without OBJ_FORCE_ACCESS_CHECK, so a standard user can copy (0x3a) and rename/move
        (0x54) arbitrary files past their DACLs, and terminate arbitrary processes by PID (0x16).
        The trusted-PID gate (0x0a) is protected only by a password that is a fixed arithmetic
        function of the PID and can be computed by any caller. Chaining the file copy and rename
        primitives to replace an image executed by SYSTEM gives standard user to SYSTEM local
        privilege escalation.
    Usecase: Elevate privileges
    Privileges: kernel
    OperatingSystem: Windows 10, Windows 11
