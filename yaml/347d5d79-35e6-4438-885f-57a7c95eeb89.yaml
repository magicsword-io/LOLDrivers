MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create atidsmxx binPath=C:\windows\temp\atidsmxx.sys type=kernel
    && sc.exe start atidsmxx
  Description: AMD's ATI DSM Dynamic Driver exposes hardware-control IOCTLs through
    \Device\AtiDCM. The interface accepts caller-controlled MSR indexes for RDMSR
    operations and exposes PCI/device I/O and physical-address mapping paths. These
    privileged primitives can disclose hardware state and support kernel-level tampering
    when the device is accessible from user mode.
  Usecase: Elevate privileges
  Privileges: kernel
  OperatingSystem: Windows 10
