Verified: 'TRUE'
Author: Michael Haag
Created: '2026-10-19'
MitreID: T1562.001
Category: vulnerable driver
Commands:
  Command: sc.exe create MonProcessControl binPath=C:\windows\temp\MonProcessControl.sys
    type=kernel && sc.exe start MonProcessControl
  Description: HONOR's MonProcessControl.sys version 1.0.0.1 exposes process termination
    through IOCTL 0x22400C on \\.\MonProcessControl. Jehad Abudagga's KillerLand research
    publishes a proof of concept that submits a four-byte target PID and reports termination
    of protected AV/EDR processes. Static analysis confirms that the handler opens
    the supplied PID with ZwOpenProcess using a kernel handle and calls ZwTerminateProcess.
    The driver restricts device access to administrators and SYSTEM and checks that
    the calling process's image path ends with \HONOR\MagicAnimation\MagicSpaceTurbo.exe.
    The published proof of concept copies itself to that path before opening the device,
    satisfying this path-based check. Protected-process termination is reported by
    the researcher and was not independently reproduced here.
  Usecase: Terminate caller-selected processes from kernel mode to impair security
    tools.
  Privileges: Administrator required to load the driver, access its device, and use
    the published proof of concept.
  OperatingSystem: Windows
