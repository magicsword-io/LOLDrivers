Commands:
  Command: sc create usafe type= filesys start= demand binPath= "C:\Users\TestComputer\Desktop\usafe.sys"
    group= "FSFilter Activity Monitor" and fltmc load usafe
  Description: The driver creates a communication port named L"\\{39341D19-B97D-4969-ADCE-4C7E934FDF49}"
    but fails to perform proper security verification or authentication on requesting
    processes within its ConnectNotifyCallback function. Furthermore, the MessageNotifyCallback
    function (specifically sub_140001D90) exposes a hardcoded cryptographic key.
    By establishing a 36-byte handshake utilizing the MagicNumber 0x55484C4F and an
    activation command MagicNumber 0x7576, a local unprivileged attacker can send
    a specialized command (0x757B) to terminate arbitrary processes. This allows attackers
    to bypass security software, terminate EDR/antivirus agents, or kill Protected
    Process Light (PPL) processes from user mode.
  Usecase: Terminate arbitrary processes from kernel mode.
  Privileges: kernel
  OperatingSystem: Windows 10, Windows 11
