Tags:
- BS_RCIO64.sys
Verified: 'TRUE'
Author: Michael Haag
Created: '2023-01-09'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create BS_RCIO64.sys binPath=C:\windows\temp\BS_RCIO64.sys type=kernel
    && sc.exe start BS_RCIO64.sys
  Description: BIOSTAR BS_RCIO64_W10 exposes IOCTLs 0x226004 and 0x226008 that map
    caller-selected physical addresses with MmMapIoSpace and read from or write to
    the mapped range. Additional IOCTLs expose raw port and PCI configuration access,
    providing privileged hardware-control primitives suitable for kernel tampering.
  OperatingSystem: Windows 10
  Privileges: kernel
  Usecase: Elevate privileges
