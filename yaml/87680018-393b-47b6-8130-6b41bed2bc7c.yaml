Tags:
- LnvMSRIO.sys
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-06-16'
MitreID: T1068
CVE:
- CVE-2025-8061
Category: vulnerable driver
Commands:
  Command: sc.exe create LnvMSRIO binPath=C:\windows\temp\LnvMSRIO.sys type=kernel
    && sc.exe start LnvMSRIO
  Description: LnvMSRIO.sys is a Lenovo Dispatcher driver affected by CVE-2025-8061.
    The tracked 3.0.2.28 through 3.1.0.36 builds predate Lenovo's fixed 3.1.0.41 driver.
    The WinMsrDev interface exposes physical-memory read and write through IOCTLs
    0x9C406104 and 0x9C40A108 and MSR read and write through 0x9C402084 and 0x9C402088,
    allowing an authenticated local user to execute code with elevated privileges
    when Memory Integrity is not enabled.
  Usecase: Elevate privileges
  Privileges: User
  OperatingSystem: Windows 10, Windows 11
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
