Id: 1a0fab94-f4a7-48c2-a2f4-72d19c382642
Tags:
- PGPwded.sys
- Symantec Encryption Desktop
- Symantec Endpoint Encryption
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
CVE:
- CVE-2019-9702
Category: vulnerable driver
Commands:
  Command: sc.exe create PGPwded type= kernel binPath= C:\\windows\\temp\\PGPwded.sys
    && sc.exe start PGPwded
  Description: PGPwded.sys in Symantec Encryption Desktop and Symantec Endpoint Encryption
    is affected by CVE-2019-9702. The storage filter exposes raw-disk read and write
    IOCTLs 0x8002206C and 0x80022070. Public research shows that a low-privileged
    user can reach these operations through a trusted PGP process, overwrite sectors
    backing protected system files, and gain SYSTEM execution after reboot. Symantec
    Encryption Desktop is affected in all versions and Symantec Endpoint Encryption
    is affected before 11.3.0.
  Usecase: Elevate privileges
  Privileges: User
  OperatingSystem: Windows
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
- https://github.com/fluffycats31/vulnerable-drivers
- https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/0/0/symsa1485
- https://nvd.nist.gov/vuln/detail/CVE-2019-9702
- https://github.com/DavidCarliez/CVE-2019-9702_Symantec_Encryption_Desktop_LPE_PoC
Detection: []
