Tags:
- HwOs2Ec10x64.sys
- HwOs2Ec.sys
- Huawei MateBook
Verified: 'TRUE'
Author: Michael Haag
Created: '2023-01-09'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create HwOs2Ec10x64.sys binPath=C:\windows\temp\HwOs2Ec10x64.sys     type=kernel
    && sc.exe start HwOs2Ec10x64.sys
  Description: Huawei HwOs2Ec 1.0.0.1 exposes kernel process termination to administrative
    callers. In the tracked HwOs2Ec.sys build, IOCTL 0x22400C accepts a four-byte
    PID, rejects only PID 0 and PID 4, opens the target with full process access,
    and calls ZwTerminateProcess. Proofpoint observed this exact signed driver deployed
    by Cruciferra as an alternative BYOVD helper for tampering with endpoint security
    tools.
  OperatingSystem: Windows 10
  Privileges: Administrator
  Usecase: Terminate protected security processes
Resources:
