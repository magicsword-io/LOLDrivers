Id: 48aeea9b-7812-4b25-9835-baaebe7dc551
Tags:
- ADRMDRVSYS.sys
Verified: 'TRUE'
Author: Northwave Cyber Security
Created: '2024-09-11'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create ADRMDRVSYS binPath=C:\windows\temp\ADRMDRVSYS.sys type=kernel
    && sc.exe start ADRMDRVSYS
  Description: ADLINK Resource Manager exposes physical-memory mapping through IOCTL
    0x2234D4, allowing low-privilege callers to read kernel memory. The interface
    has also been weaponized by Blackout Reloaded to terminate protected antimalware
    processes through a driver path that reaches ZwTerminateProcess.
  Usecase: Elevate privileges
  Privileges: kernel
  OperatingSystem: Windows 10
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
- https://northwave-cybersecurity.com/vulnerability-notice-adlink-pxi-platform-services?hsLang=en
- https://github.com/tijme/blackout-reloaded
- https://github.com/fluffycats31/vulnerable-drivers
Detection: []
Acknowledgement:
  Person: Northwave Cyber Security, fluffycats31
  Handle: '@fluffycats31'
