Id: e41d5471-c4b8-48da-bdb7-e462008c2e78
Tags:
- cpqsysio64.sys
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-04-13'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create cpqsysio binPath=C:\windows\temp\cpqsysio64.sys type=kernel
    && sc.exe start cpqsysio
  Description: cpqsysio64.sys is a Hewlett-Packard physical-memory driver distributed
    with ProLiant support and firmware utilities. The tracked 4.5.0.0 and 4.6.0.0
    builds handle IOCTL 0x152EF0 by accepting a caller-supplied physical address and
    length, mapping that range with MmMapIoSpace, and copying from it without constraining
    the requested physical range. An administrator with device access can read arbitrary
    physical memory, disclose kernel-sensitive data, and recover addresses that undermine
    kernel address randomization.
  Usecase: Read arbitrary physical memory
  Privileges: Administrator
  OperatingSystem: Windows 10
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/311
- https://github.com/magicsword-io/LOLDrivers/issues/409
