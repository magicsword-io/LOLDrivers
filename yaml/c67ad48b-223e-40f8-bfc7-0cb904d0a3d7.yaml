Tags:
- pskmad_64.sys
- PSKMAD.sys
- Panda Kernel Memory Access Driver
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
CVE:
- CVE-2023-6330
- CVE-2023-6331
- CVE-2023-6332
Category: vulnerable driver
Commands:
  Command: sc.exe create PSKMAD type= kernel binPath= C:\\windows\\temp\\pskmad_64.sys
    && sc.exe start PSKMAD
  Description: Panda Kernel Memory Access Driver versions through 1.1.0.21 are affected
    by CVE-2023-6330, CVE-2023-6331, and CVE-2023-6332. The tracked 1.0.0.16 and 1.0.0.17
    builds expose IOCTL 0xB3702C08 through \Device\PSMEMDriver. After a fixed magic
    value, the request accepts a process, address, and caller-controlled length without
    relating that length to the fixed buffered-I/O header, allowing kernel-memory
    disclosure and buffered-output corruption.
  Usecase: Read kernel memory and corrupt non-paged kernel memory
  Privileges: Administrator
  OperatingSystem: Windows
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
