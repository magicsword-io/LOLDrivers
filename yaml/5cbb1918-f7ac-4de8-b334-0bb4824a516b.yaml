Commands:
  Command: ''
  Description: Nextron Systems identifies this rksafe sample as a rootkit with input
    interception, anti-debugging, minifilter callbacks, and process protection. Static
    analysis confirms cross-process memory read/write routines, minifilter registration
    with a communication port, process and thread object callbacks, and logic that
    clears KdDebuggerEnabled. Input interception and successful runtime protection
    effects were not independently tested.
  Usecase: Read and modify process memory and interfere with kernel debugging.
  Privileges: kernel
  OperatingSystem: Windows x64
