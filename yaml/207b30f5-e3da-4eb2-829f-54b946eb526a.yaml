Tags:
- AsusSAIO.sys
- ASUSSAIO
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
CVE:
- CVE-2024-55408
Category: vulnerable driver
Commands:
  Command: sc.exe create AsusSAIO binPath=C:\windows\temp\AsusSAIO.sys type=kernel
    && sc.exe start AsusSAIO
  Description: ASUS System Analysis IO release lines before 1.0.30.0 and before 3.1.41.0
    are affected by CVE-2024-55408. The tracked 1.0.1.0 through 1.0.9.0 builds fall
    inside the affected 1.x line and expose FILE_ANY_ACCESS platform-control IOCTLs
    through the \Device\AsusSAIO interface. Capabilities vary by build and include
    PCI-derived MMIO, SMBus, I/O-port, and model-specific register operations without
    a caller-token authorization gate, allowing local callers to misuse privileged
    hardware controls.
  Usecase: Elevate privileges
  Privileges: User
  OperatingSystem: Windows 10
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
- https://github.com/fluffycats31/vulnerable-drivers
- https://nvd.nist.gov/vuln/detail/CVE-2024-55408
- https://github.com/heyheysky/vulnerable-driver/blob/master/CVE-2024-55408/CVE-2024-55408_AsusSAIO.sys_README.md
