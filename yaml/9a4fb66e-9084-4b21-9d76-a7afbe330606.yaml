Category: vulnerable driver
Commands:
  Command: sc.exe create AMDPowerProfiler.sys binPath=C:\windows\temp\AMDPowerProfiler.sys     type=kernel
    && sc.exe start AMDPowerProfiler.sys
  Description: AMD uProf 3.0.278 includes an AMDPowerProfiler driver affected by CVE-2021-26334.
    Insufficient access control permits lower-privileged callers to access model-specific
    registers, which can lead to privilege escalation and ring-0 code execution.
  OperatingSystem: Windows 10
  Privileges: kernel
  Usecase: Elevate privileges
