Verified: 'TRUE'
Author: Michael Haag, Zhang Tingjia
Created: '2026-06-16'
MitreID: T1068
CVE: CVE-2025-45737
Category: vulnerable driver
Commands:
  Command: sc.exe create NeacSafe64 binPath=C:\windows\temp\NeacSafe64.sys type=kernel
    && sc.exe start NeacSafe64
  Description: NetEase NeacSafe64.sys is an anti-cheat mini-filter driver referenced
    by KDU and public NeacController research. Versions prior to 1.0.0.8 expose IOCTL/message-handler
    paths that provide arbitrary kernel read/write primitives and can be chained for
    SYSTEM privilege escalation or kernel-mode code execution.
  Usecase: Abuse arbitrary kernel read/write primitives for local privilege escalation
    and kernel-mode code execution.
  Privileges: kernel
  OperatingSystem: Windows 10, Windows 11
Resources:
