MitreID: T1562.001
Category: vulnerable driver
Commands:
  Command: ''
  Description: 'Malwarebytes'' mbamchameleon.sys 3.2.0.456 exposes process termination
    to verified, registered client processes. The reported Bring Your Own Trusted
    Caller technique abuses administrator-level control of a genuine signed Malwarebytes
    client: the driver''s on-disk image verification does not attest to the integrity
    of code executing inside that client. Static analysis confirms client verification
    and registration through IOCTL 0x222008 and a current-process client-state gate
    before IOCTL 0x222024 reaches ZwTerminateProcess for a supplied process identifier.
    An unrelated unsigned process does not meet those checks. The driver must be loaded
    and the caller must execute inside a verified, registered client. This record
    is limited to the reviewed sample and does not assert that all current product
    versions are affected.'
  Usecase: Abuse a trusted client to terminate processes and impair endpoint defenses.
  Privileges: Administrator-level control of a genuine verified and registered client
    process.
  OperatingSystem: Windows
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/435
- https://xusheng.dev/posts/byotc/main/
