Tags:
- WinRing0.sys
- WinRing0x64
- OpenHardwareMonitorLib.sys
Verified: 'TRUE'
Author: Michael Haag
Created: '2023-01-09'
MitreID: T1068
Category: vulnerable driver
Commands:
  Command: sc.exe create WinRing0.sys binPath=C:\windows\temp\WinRing0.sys type=kernel
    && sc.exe start WinRing0.sys
  Description: OpenLibSys WinRing0 hardware-access drivers expose MSR, I/O-port, and
    physical-memory operations to user mode. Attackers can abuse these primitives
    for kernel-memory access and security-control tampering.
  OperatingSystem: Windows 10
  Privileges: kernel
  Usecase: Elevate privileges
