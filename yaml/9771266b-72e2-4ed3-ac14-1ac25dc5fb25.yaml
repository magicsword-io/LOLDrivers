Tags:
- hax.sys
- IntelHaxm.sys
- Intel HAXM
- Hardware Accelerated Execution Manager
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
CVE:
- CVE-2022-21812
Category: vulnerable driver
Commands:
  Command: sc.exe create IntelHAXM type= kernel binPath= C:\\windows\\temp\\hax.sys
    && sc.exe start IntelHAXM
  Description: Intel Hardware Accelerated Execution Manager versions before 7.7.1
    are affected by CVE-2022-21812. The tracked 6.1.0 through 7.7.0 IntelHaxm.sys
    builds all precede the fixed release. Improper access control on the \Device\GHAX
    interface allows an authenticated local user to cross the user-to-kernel security
    boundary and elevate privileges.
  Usecase: Elevate privileges
  Privileges: User
  OperatingSystem: Windows
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
