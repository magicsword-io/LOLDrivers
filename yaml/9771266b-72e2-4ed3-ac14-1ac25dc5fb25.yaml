Tags:
- hax.sys
- Intel HAXM
- Hardware Accelerated Execution Manager
Verified: 'TRUE'
Author: Michael Haag
Created: '2026-08-31'
MitreID: T1068
CVE:
- CVE-2022-21812
Category: vulnerable driver
Commands:
  Command: sc.exe create IntelHAXM type= kernel binPath= C:\\windows\\temp\\hax.sys
    && sc.exe start IntelHAXM
  Description: Intel Hardware Accelerated Execution Manager versions before 7.7.1
    are affected by CVE-2022-21812. The signed 7.6.5, 7.6.5.3, and 7.7.0 builds tracked
    here expose the \\Device\\GHAX interface. Improper access control in the driver
    allows an authenticated local user to cross the user-to-kernel security boundary
    and elevate privileges.
  Usecase: Elevate privileges
  Privileges: User
  OperatingSystem: Windows
Resources:
- https://github.com/magicsword-io/LOLDrivers/issues/409
