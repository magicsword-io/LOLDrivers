name: generate-svg-counter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generate-counter.yml'
      - 'bin/gen-counter.py'
      - 'bin/publish-counter.sh'
      - 'bin/tests/test_counter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.1
      - name: Test counter generation and concurrent pushes
        run: python -m unittest discover -s bin/tests -p test_counter.py -v

  generate-counter:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-counter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: readme-driver-counter-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.PUSH_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.1
      - name: Recount and publish the README badge
        run: bash bin/publish-counter.sh
