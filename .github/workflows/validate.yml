name: Validate YAMLs

on: 
  push:
    branches:
      - "*"
  pull_request:
    branches: [main]

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        lfs: true # Native YARA controls require driver bytes, not LFS pointers.
    - name: Set up Python 3.11
      uses: actions/setup-python@v4.5.0
      with:
        python-version: 3.11
    - name: Install pinned validation dependencies
      run: python -m pip install -r bin/requirements-safety.txt
    - name: Run YAML and Driver Checks
      run: python bin/validate.py -v
    - name: Test API and detection exports
      run: python -m unittest discover -s bin/tests -p 'test_*.py'
