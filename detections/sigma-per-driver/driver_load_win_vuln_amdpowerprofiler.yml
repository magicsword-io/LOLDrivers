title: Driver Load - AMDPowerProfiler.sys
id: 3399e9c9-af29-5f53-99ed-3ea32179756e
status: experimental
description: |
    Detects loading of driver AMDPowerProfiler.sys via hash.
    AMD uProf AMDPowerProfiler.sys is affected by CVE-2021-26334. Insufficient access control permits lower-privileged callers to access model-specific registers, which can lead to privilege escalation and ring-0 code execution. AMD addresses the issue in the Windows uProf 3.4.494 release.
references:
    - https://www.loldrivers.io/drivers/9a4fb66e-9084-4b21-9d76-a7afbe330606/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
