    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=43fe428d3e109c81bb1737afd0f9bfa6'
            - 'SHA1=7be590049b5396056f2384a3b56bf2db11b286e1'
            - 'SHA256=9bf3b737afa4d4f5e7b00ec749d4b75656ad66d9a2b402e1e81934e95ba7df5b'
            - 'IMPHASH=7170ec91f64a93d0b46d51b933b99cca'
    condition: selection_hashes
falsepositives:
    - Unknown
level: high
