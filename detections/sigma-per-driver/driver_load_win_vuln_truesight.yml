title: Driver Load - truesight.sys
id: e8f21d44-6b22-5793-8001-f8f59bb973f2
status: experimental
description: |
    Detects loading of driver truesight.sys via hash.
    Adlice TrueSight.sys exposes kernel-mode process termination through IOCTL 0x22E044. Static inspection of the 2.0.2 sample confirms that a caller-supplied PID reaches ZwOpenProcess with PROCESS_TERMINATE and then ZwTerminateProcess. Public Darkside research documents abuse of version 3.3 and reports a fix in 3.4; Check Point describes exploitation of legacy builds. The 2.0.2 submitter reports process termination and automatic restart in a Windows 11 VM. That recording does not establish the target process's PPL status. Loading behavior depends on Windows policy, signing and blocklist state; no general HVCI or WDAC bypass is asserted for the added sample.
