status: experimental
description: |
    Detects loading of driver ADV64DRV.sys via name.
references:
    - https://www.loldrivers.io/drivers/24fb7bab-b8c3-46ea-a370-c84d2f0ff614/
    - https://github.com/namazso/physmem_drivers
