    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=1b2497558f05c560e25b09c45d033245'
            - 'SHA1=6e3bf05225d003e401e81edbe38afc7aa7156cb5'
            - 'SHA256=5aeae04dd27ff148cb8c0f646e34b0404a963b8ec6fc930e75ae5b09d5ec3291'
            - 'IMPHASH=54f82d5e9dac107659ee1b9ed28e8856'
    condition: selection_hashes
falsepositives:
    - Unknown
level: high
