title: Driver Load - AMDRyzenMasterDriver.sys
id: e7b72bb7-80cd-5eac-9199-042fa3c467ed
status: experimental
description: |
    Detects loading of driver AMDRyzenMasterDriver.sys via hash.
    AMD Ryzen Master drivers affected by CVE-2023-20564 insufficiently validate IOCTL input buffers. A privileged caller can read or write memory through the exposed interface, potentially enabling arbitrary kernel execution.
