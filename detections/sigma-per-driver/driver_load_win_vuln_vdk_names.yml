title: Driver Load - vdk.sys
id: 01603b40-4324-5fe0-8e01-cd74918759ef
status: experimental
description: |
    Detects loading of driver vdk.sys via name.
    A vulnerable kernel driver that can be used to disable Code Integrity
references:
    - https://www.loldrivers.io/drivers/d009b5bf-d999-4d0b-a4be-1bcbe1effc15/
    - https://web.archive.org/web/20160808182709/https://kat.lua.cz/posts/Some_fun_with_vintage_bugs_and_driver_signing_enforcement/
    - https://doi.org/10.1016/j.cose.2026.105194
author: Andrea Monzani
date: 2026/10/25
modified: 2026/10/26
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\vdk.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
