title: Driver Load - WibuKey64.sys
id: d2789bca-4960-5ce1-8e1a-61b9b229db5e
status: experimental
description: |
    Detects loading of driver WibuKey64.sys via name.
    WibuKey for Windows releases before 6.70 are affected by CVE-2024-45181 and CVE-2024-45182. Version 6.70 is separately affected by the boundary-validation flaw documented in WIBU-100057 and fixed in 6.71. The tracked 6.40 and 6.50a builds fall in the first affected range. In the tracked 6.70 build, subcommand 0x14 of IOCTL 0x8200E804 combines a caller-controlled offset with an input-buffer pointer without validating that the resulting object remains inside the request, enabling out-of-bounds kernel access.
references:
    - https://www.loldrivers.io/drivers/a07e5897-3835-4188-9e3e-bd810c3e34a5/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-94453.pdf
    - https://nvd.nist.gov/vuln/detail/CVE-2024-45181
    - https://nvd.nist.gov/vuln/detail/CVE-2024-45182
    - https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-100057.pdf
author: Michael Haag
date: 2026/08/31
modified: 2026/09/08
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\wibukey64.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
