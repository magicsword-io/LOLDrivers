title: Driver Load - PCHunter.sys
id: 2e785818-50c1-5053-8055-689cfd2fb491
status: experimental
description: |
    Detects loading of driver PCHunter.sys via name.
    Epoolsoft Windows Information View Tools
references:
    - https://www.loldrivers.io/drivers/a261cd64-0d04-4bf5-ad73-f3bb96bf83cf/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
author: Michael Haag
date: 2023/01/09
modified: 2026/08/28
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\pchunter.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
