title: Driver Load - giveio.sys
id: 66ada927-c23c-5dd0-a981-ca3e7e5fb0b5
status: experimental
description: |
    Detects loading of driver giveio.sys via name.
    The 32-bit giveio driver bundled with SpeedFan creates the \\.\giveio device and handles IRP_MJ_CREATE by applying a zeroed 8 KiB I/O permission map to the opening process through Ke386IoSetAccessProcess and Ke386SetIoAccessMap. This grants unrestricted direct access to all x86 I/O ports without validating the caller.
references:
    - https://www.loldrivers.io/drivers/50bbae3f-f6d8-4881-8fd7-a70002d52841/
    - https://github.com/magicsword-io/LOLDrivers/issues/407
    - https://www.almico.com/speedfan.php
author: impudent
date: 2026/08/29
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\giveio.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
