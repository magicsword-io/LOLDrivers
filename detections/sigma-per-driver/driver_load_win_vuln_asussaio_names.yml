title: Driver Load - AsusSAIO.sys
id: 536ea29e-1989-565b-977a-e3eda6bc9e9c
status: experimental
description: |
    Detects loading of driver AsusSAIO.sys via name.
    ASUS System Analysis IO release lines before 1.0.30.0 and before 3.1.41.0 are affected by CVE-2024-55408. The tracked 1.0.1.0 through 1.0.9.0 builds fall inside the affected 1.x line and expose FILE_ANY_ACCESS platform-control IOCTLs through the \Device\AsusSAIO interface. Capabilities vary by build and include PCI-derived MMIO, SMBus, I/O-port, and model-specific register operations without a caller-token authorization gate, allowing local callers to misuse privileged hardware controls.
references:
    - https://www.loldrivers.io/drivers/207b30f5-e3da-4eb2-829f-54b946eb526a/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://nvd.nist.gov/vuln/detail/CVE-2024-55408
    - https://github.com/heyheysky/vulnerable-driver/blob/master/CVE-2024-55408/CVE-2024-55408_AsusSAIO.sys_README.md
author: Michael Haag
date: 2026/08/31
modified: 2026/09/08
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\asussaio.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
