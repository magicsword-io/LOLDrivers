title: Driver Load - ADRMDRVSYS.sys
id: c0bbf041-bdf4-5d25-a103-0bb995f1b7f2
status: experimental
description: |
    Detects loading of driver ADRMDRVSYS.sys via name.
    ADLINK Resource Manager exposes physical-memory mapping through IOCTL 0x2234D4, allowing low-privilege callers to read kernel memory. The interface has also been weaponized by Blackout Reloaded to terminate protected antimalware processes through a driver path that reaches ZwTerminateProcess.
references:
    - https://www.loldrivers.io/drivers/48aeea9b-7812-4b25-9835-baaebe7dc551/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://northwave-cybersecurity.com/vulnerability-notice-adlink-pxi-platform-services?hsLang=en
    - https://github.com/tijme/blackout-reloaded
    - https://github.com/fluffycats31/vulnerable-drivers
author: Northwave Cyber Security
date: 2024/09/11
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\adrmdrvsys.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
