title: Driver Load - xhunter1.sys
id: 3a6a6bad-c0ca-5d8d-9fd4-da8190e9d85a
status: experimental
description: |
    Detects loading of driver xhunter1.sys via hash.
    Wellbia xhunter1.sys is an XIGNCODE3 anti-cheat kernel component affected by CVE-2026-3609 through version 2023.12.7.78. Public research demonstrates that its unauthenticated command channel can expose protected-process handles, read cross-process memory, terminate security processes, elevate privileges, and inject code from kernel context.
