title: Driver Load - LenovoDiagnosticsDriver.sys
id: 2b19e8c7-6935-55c9-ac16-d6c6c2ac35ef
status: experimental
description: |
    Detects loading of driver LenovoDiagnosticsDriver.sys via hash.
    Lenovo Diagnostics versions before 4.45 are affected by CVE-2022-3699. Public exploit research documents FILE_ANY_ACCESS IOCTLs 0x222010 and 0x222014 in LenovoDiagnosticsDriver.sys that map caller-selected physical addresses and copy values from or to mapped memory. These arbitrary physical-memory read and write primitives allow a low-privileged local user to execute code with elevated privileges.
references:
    - https://www.loldrivers.io/drivers/81a73e57-2e92-4d21-97d3-1c21eb4c3aea/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
