title: Driver Load - LenovoDiagnosticsDriver.sys
id: 2b19e8c7-6935-55c9-ac16-d6c6c2ac35ef
status: experimental
description: |
    Detects loading of driver LenovoDiagnosticsDriver.sys via hash.
    Lenovo Diagnostics versions before 4.45 are covered by CVE-2022-3699. The vulnerable driver behavior tracked here is limited to confirmed 1.0.2.0 through 1.0.4.0 LenovoDiagnosticsDriver.sys builds. Their low-user device ACL exposes FILE_ANY_ACCESS IOCTLs 0x222010 and 0x222014, which map caller-selected physical addresses and provide unrestricted physical-memory read and write primitives. Later 3.1.0.0 code removed the write path, denied Builtin Users, and limited reads to allowlisted PCI registers, so that build is not tracked here.
