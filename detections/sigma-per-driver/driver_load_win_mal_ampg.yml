    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=7d2e5acea9c550f05fbcc61540ffa1ac'
            - 'SHA1=a97182c8b376d1deb07e69e946eb3bc99d6c7670'
            - 'SHA256=cacaf0698c6371f8cc45fae85a13fb738f0b8ce0db716c5e4d0d12152de163e3'
            - 'IMPHASH=abcb64dc410e5fb75185251ef1ba338e'
    condition: selection_hashes
falsepositives:
