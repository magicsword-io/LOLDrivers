title: Driver Load - WinRing0.sys
id: f5c82d9e-73b0-54a1-8989-c8747a70a248
status: experimental
description: |
    Detects loading of driver WinRing0.sys via hash.
    OpenLibSys WinRing0 hardware-access drivers expose MSR, I/O-port, and physical-memory operations to user mode. Attackers can abuse these primitives for kernel-memory access and security-control tampering.
