title: Driver Load - PGPwded.sys
id: d565ef4b-27a5-5a94-8179-ba1b6452f2a3
status: experimental
description: |
    Detects loading of driver PGPwded.sys via name.
    PGPwded.sys and eedDiskEncryptionDriver.sys are Symantec drive-encryption filters affected by CVE-2019-9702 and CVE-2019-9703. Symantec Endpoint Encryption releases before 11.3.0 and all Symantec Encryption Desktop releases are affected. The tracked filters expose raw-sector read and write controls. In the 11.1.1 eedDiskEncryptionDriver build, any-access IOCTLs 0x8002206C and 0x80022070 select a tracked volume and read or write sectors; its protected-range logic still permits writes beginning in sectors 0 through 2, leaving boot-sector modification possible.
references:
    - https://www.loldrivers.io/drivers/1a0fab94-f4a7-48c2-a2f4-72d19c382642/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/0/0/symsa1485
    - https://nvd.nist.gov/vuln/detail/CVE-2019-9702
    - https://nvd.nist.gov/vuln/detail/CVE-2019-9703
    - https://github.com/DavidCarliez/CVE-2019-9702_Symantec_Encryption_Desktop_LPE_PoC
author: Michael Haag
date: 2026/08/31
modified: 2026/09/08
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\pgpwded.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
