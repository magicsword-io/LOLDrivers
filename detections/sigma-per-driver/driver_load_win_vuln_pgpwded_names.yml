title: Driver Load - PGPwded.sys
id: d565ef4b-27a5-5a94-8179-ba1b6452f2a3
status: experimental
description: |
    Detects loading of driver PGPwded.sys via name.
    PGPwded.sys in Symantec Encryption Desktop and Symantec Endpoint Encryption is affected by CVE-2019-9702. The storage filter exposes raw-disk read and write IOCTLs 0x8002206C and 0x80022070. Public research shows that a low-privileged user can reach these operations through a trusted PGP process, overwrite sectors backing protected system files, and gain SYSTEM execution after reboot. Symantec Encryption Desktop is affected in all versions and Symantec Endpoint Encryption is affected before 11.3.0.
references:
    - https://www.loldrivers.io/drivers/1a0fab94-f4a7-48c2-a2f4-72d19c382642/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/0/0/symsa1485
    - https://nvd.nist.gov/vuln/detail/CVE-2019-9702
    - https://github.com/DavidCarliez/CVE-2019-9702_Symantec_Encryption_Desktop_LPE_PoC
author: Michael Haag
date: 2026/08/31
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\pgpwded.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
