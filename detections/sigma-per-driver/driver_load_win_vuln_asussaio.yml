title: Driver Load - AsusSAIO.sys
id: 798da2da-1280-5c28-bc77-0b8c00a75aec
status: experimental
description: |
    Detects loading of driver AsusSAIO.sys via hash.
    ASUS System Analysis IO release lines before 1.0.30.0 and before 3.1.41.0 are affected by CVE-2024-55408. The tracked 1.0.1.0 through 1.0.9.0 builds fall inside the affected 1.x line and expose FILE_ANY_ACCESS platform-control IOCTLs through the \Device\AsusSAIO interface. Capabilities vary by build and include PCI-derived MMIO, SMBus, I/O-port, and model-specific register operations without a caller-token authorization gate, allowing local callers to misuse privileged hardware controls.
references:
    - https://www.loldrivers.io/drivers/207b30f5-e3da-4eb2-829f-54b946eb526a/
