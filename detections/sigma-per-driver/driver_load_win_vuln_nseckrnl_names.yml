title: Driver Load - NSecKrnl.sys
id: 23a24186-411f-58a1-835f-177cc98a4bb0
status: experimental
description: |
    Detects loading of driver NSecKrnl.sys via name.
    NSecKrnl.sys exposes process termination through IOCTL 0x2248E0 (CVE-2025-68947). Public reporting documents its use by ValleyRAT malware and the Reynolds and Warlock ransomware operations to terminate security processes. SentinelOne reports that Reynolds targeted more than 30 security processes.
references:
    - https://www.loldrivers.io/drivers/c1143cd9-a709-4323-9678-2117285d1b47/
    - https://hexastrike.com/resources/blog/threat-intelligence/valleyrat-exploiting-byovd-to-kill-endpoint-security/
    - https://github.com/ANYLNK/NSecSoftBYOVD
    - https://symantec-blogs.broadcom.com/threat-intelligence/black-basta-ransomware-byovd
    - https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/
    - https://www.trendmicro.com/en_gb/research/26/c/dissecting-a-warlock-attack.html
    - https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure
    - https://www.sentinelone.com/blog/bring-your-own-vulnerable-driver-how-edr-killing-became-an-industry/
author: Michael Haag
date: 2025/09/18
modified: 2026/10/19
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\nseckrnl.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
