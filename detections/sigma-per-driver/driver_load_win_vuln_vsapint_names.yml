title: Driver Load - vsapint.sys
id: 40494156-523e-5eaa-9336-f2320bd4a730
status: experimental
description: |
    Detects loading of driver vsapint.sys via name.
    A vulnerable kernel driver that can be used to disable Code Integrity
references:
    - https://www.loldrivers.io/drivers/8b8bbbfe-798b-47bf-991b-21a0a0becef3/
    - https://web.archive.org/web/20160808182709/https://kat.lua.cz/posts/Some_fun_with_vintage_bugs_and_driver_signing_enforcement/
    - https://doi.org/10.1016/j.cose.2026.105194
author: Andrea Monzani
date: 2026/10/25
modified: 2026/10/26
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\vsapint.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
