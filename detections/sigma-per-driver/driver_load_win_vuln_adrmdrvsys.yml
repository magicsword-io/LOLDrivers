title: Driver Load - ADRMDRVSYS.sys
id: b0fba088-31e7-5be4-92c7-b1b6058e8615
status: experimental
description: |
    Detects loading of driver ADRMDRVSYS.sys via hash.
    ADLINK Resource Manager exposes physical-memory mapping through IOCTL 0x2234D4, allowing low-privilege callers to read kernel memory. The interface has also been weaponized by Blackout Reloaded to terminate protected antimalware processes through a driver path that reaches ZwTerminateProcess.
references:
    - https://www.loldrivers.io/drivers/48aeea9b-7812-4b25-9835-baaebe7dc551/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
