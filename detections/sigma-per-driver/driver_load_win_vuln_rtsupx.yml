            - 'SHA256=6e29c49f9e97747c77e5929d026538b5e7e2d999fefe1dd502a6a422b7cb6485'
            - 'IMPHASH=ab986ade8b3cc340f30c1f64554034d7'
    condition: selection_hashes
falsepositives:
