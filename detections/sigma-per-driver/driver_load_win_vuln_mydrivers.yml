title: Driver Load - mydrivers.sys
id: 4b5c2327-3f45-55d6-b52e-715b1b0249d1
status: experimental
description: |
    Detects loading of driver mydrivers.sys via hash.
    DriverGenius mydrivers.sys 9.2.707.1214 is affected by CVE-2023-1676. IOCTL 0x9C402088 dispatches caller-controlled values to the privileged WRMSR instruction without adequate access control. A local user can corrupt kernel state, execute code in ring 0, and elevate privileges.
references:
    - https://www.loldrivers.io/drivers/d9e00cc7-a8f4-4390-a6dc-0f5423e97da4/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
    - https://github.com/magicsword-io/LOLDrivers/issues/409
