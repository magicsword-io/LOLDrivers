title: Driver Load - tosrfec.sys
id: f38e62f8-894d-5fcd-adee-1221ec2647f3
status: experimental
description: |
    Detects loading of driver tosrfec.sys via name.
    A vulnerable kernel driver that can be used to disable Code Integrity
references:
    - https://www.loldrivers.io/drivers/afbc0243-ce03-4f2b-ace5-0a721297aaf2/
    - https://web.archive.org/web/20160808182709/https://kat.lua.cz/posts/Some_fun_with_vintage_bugs_and_driver_signing_enforcement/
    - https://doi.org/10.1016/j.cose.2026.105194
author: Andrea Monzani
date: 2026/10/25
modified: 2026/10/26
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\tosrfec.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
