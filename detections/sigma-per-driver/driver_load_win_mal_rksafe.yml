    - attack.t1543.003
    - attack.t1068
    - loldrivers.malicious
logsource:
    product: windows
    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=76d36fee8ee297ab69b4cfce2cd4ac52'
            - 'SHA1=8f6391cc23e039b0db4601ea1f67da4c77998414'
            - 'SHA256=81fbcacbc28001909391dbdafd9854ca997befa38dee4f2d9e8fbdbd00bc3723'
            - 'IMPHASH=92769171fb6a4a5813e670c2030965c6'
    condition: selection_hashes
falsepositives:
