title: Driver Load - tmnciesc.sys
id: cd6be637-43b5-5ae6-8476-a2e6e80a828d
status: experimental
description: |
    Detects loading of driver tmnciesc.sys via name.
    A vulnerable kernel driver that can be used to disable Code Integrity
references:
    - https://www.loldrivers.io/drivers/2b1e1095-5119-4419-9790-4206b23be0b5/
    - https://web.archive.org/web/20160808182709/https://kat.lua.cz/posts/Some_fun_with_vintage_bugs_and_driver_signing_enforcement/
    - https://doi.org/10.1016/j.cose.2026.105194
author: Andrea Monzani
date: 2026/10/25
modified: 2026/10/26
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\tmnciesc.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
