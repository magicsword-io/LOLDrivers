title: Driver Load - AmdTools64.sys
id: 1a7c0777-2fa7-562e-a308-cc46dc4f6803
status: experimental
description: |
    Detects loading of driver AmdTools64.sys via hash.
    AMD Special Tools Driver AmdTools64.sys 1.7.16.219 exposes physical-memory mapping through IOCTL 0xFFF028A4. Static analysis confirms that the handler passes a caller-supplied physical address and length to MmMapIoSpace, constructs an MDL, and maps the range into the caller's user-mode address space with MmMapLockedPagesSpecifyCache, without a physical-range authorization check. The device uses FILE_DEVICE_SECURE_OPEN and a security descriptor granting access only to LocalSystem and Builtin Administrators. This is an administrator/SYSTEM-gated physical-memory primitive, not a standard-user entry point. The PnP driver must be installed and its device interface started before the request can be used. The assessment is limited to this exact sample and does not assert an affected-version range.
references:
    - https://www.loldrivers.io/drivers/1bab0fae-7908-4fae-9db7-73562c7d92cd/
    - https://github.com/magicsword-io/LOLDrivers/issues/430
    - https://github.com/methmind/amdtools64
