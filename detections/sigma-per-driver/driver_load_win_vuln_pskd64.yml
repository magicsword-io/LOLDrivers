title: Driver Load - PSKD64.SYS
id: e3acd2d8-6df6-52aa-bd9a-1daa11a9b3bb
status: experimental
description: |
    Detects loading of driver PSKD64.SYS via hash.
    APSoft PCIScope's PSKD64 driver exposes memory-access operations through \\.\PSKD64. IOCTL 0x220044 dispatches sub-operations 0x701E and 0x701F for caller-selected virtual or physical memory reads and writes without constraining the target address. Public testing demonstrates arbitrary kernel read/write on Windows 11, including process protection removal and security-process termination.
references:
    - https://www.loldrivers.io/drivers/7789e9ca-8508-486b-9d77-7497c5c61474/
    - https://www.tssc.de/site/products/tools/pciscope
    - https://www.tssc.de/site/download/prods/pciscope.exe
    - https://github.com/magicsword-io/LOLDrivers/issues/408
author: Venexy
date: 2026/08/29
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=741daa162541343e15f0448487ca52c5'
            - 'SHA1=9bd89c27aa2b230feea1171798bfc0e24652444a'
            - 'SHA256=34cdbf48f5a51ca9553c14f007aaa1b67c24e1334d8cb29e80f07c80c5dc07e7'
            - 'IMPHASH=cec72858409b9ae0decb0b0cd9111791'
    condition: selection_hashes
falsepositives:
    - Unknown
level: high
