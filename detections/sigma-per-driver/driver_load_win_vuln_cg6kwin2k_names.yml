title: Driver Load - cg6kwin2k.sys
id: 1faf9c6a-1e22-591d-a18e-b68d8991e0f2
status: experimental
description: |
    Detects loading of driver cg6kwin2k.sys via name.
    Sangoma cg6kwin2k versions before 2.1.7.0 expose IOCTLs without sufficient access control. A low-privilege user can perform I/O against arbitrary hardware ports or physical addresses, enabling firmware erasure or modification.
references:
    - https://www.loldrivers.io/drivers/fda3ff67-12dc-488c-a4c2-603f5bf420bd/
    - https://blogs.vmware.com/security/2023/10/hunting-vulnerable-kernel-drivers.html
    - https://jvndb.jvn.jp/en/contents/2024/JVNDB-2024-003008.html
    - https://nvd.nist.gov/vuln/detail/CVE-2024-29216
    - https://github.com/fluffycats31/vulnerable-drivers
author: Takahiro Haruyama
date: 2023/11/02
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\cg6kwin2k.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
