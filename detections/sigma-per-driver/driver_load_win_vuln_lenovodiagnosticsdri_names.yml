title: Driver Load - LenovoDiagnosticsDriver.sys
id: 6667861d-8bca-5911-8d07-268d18c6b9aa
status: experimental
description: |
    Detects loading of driver LenovoDiagnosticsDriver.sys via name.
    Lenovo Diagnostics versions before 4.45 are covered by CVE-2022-3699. The vulnerable driver behavior tracked here is limited to confirmed 1.0.2.0 through 1.0.4.0 LenovoDiagnosticsDriver.sys builds. Their low-user device ACL exposes FILE_ANY_ACCESS IOCTLs 0x222010 and 0x222014, which map caller-selected physical addresses and provide unrestricted physical-memory read and write primitives. Later 3.1.0.0 code removed the write path, denied Builtin Users, and limited reads to allowlisted PCI registers, so that build is not tracked here.
references:
    - https://www.loldrivers.io/drivers/81a73e57-2e92-4d21-97d3-1c21eb4c3aea/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
    - https://nephosec.com/cve-2022-3699-lenovo-diagnostics-driver-eop-arbitrary-r-w/
    - https://github.com/alfarom256/CVE-2022-3699
    - https://support.lenovo.com/us/en/solutions/ps500533-lenovo-diagnostics-vulnerabilities
    - https://nvd.nist.gov/vuln/detail/CVE-2022-3699
    - https://github.com/fluffycats31/vulnerable-drivers
author: Michael Haag
date: 2023/01/09
modified: 2026/09/08
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\lenovodiagnosticsdriver.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
