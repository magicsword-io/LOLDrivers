title: Driver Load - btfilter.sys
id: 10fdc355-c8fb-51a2-9101-c1f76e799901
status: experimental
description: |
    Detects loading of driver btfilter.sys via name.
    A vulnerable kernel driver that can be used to disable Code Integrity
references:
    - https://www.loldrivers.io/drivers/7d4439c5-1ee3-4297-99ea-bb7eab3c256c/
    - https://web.archive.org/web/20160808182709/https://kat.lua.cz/posts/Some_fun_with_vintage_bugs_and_driver_signing_enforcement/
    - https://doi.org/10.1016/j.cose.2026.105194
author: Andrea Monzani
date: 2026/10/25
modified: 2026/10/26
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\btfilter.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
