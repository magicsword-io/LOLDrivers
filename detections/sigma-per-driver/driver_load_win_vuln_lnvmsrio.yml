title: Driver Load - LnvMSRIO.sys
id: c61f42be-5cb7-5c5c-a69f-b011c57ad48a
status: experimental
description: |
    Detects loading of driver LnvMSRIO.sys via hash.
    LnvMSRIO.sys is a Lenovo Dispatcher driver affected by CVE-2025-8061. The tracked 3.0.2.28 through 3.1.0.36 builds predate Lenovo's fixed 3.1.0.41 driver. The WinMsrDev interface exposes physical-memory read and write through IOCTLs 0x9C406104 and 0x9C40A108 and MSR read and write through 0x9C402084 and 0x9C402088, allowing an authenticated local user to execute code with elevated privileges when Memory Integrity is not enabled.
