title: Driver Load - WinIo64.sys
id: 1ea5c75d-897a-5207-ac21-993d1b5f294d
status: experimental
description: |
    Detects loading of driver WinIo64.sys via name.
    WinIo64 is a hardware-access driver based on the WinIo library that provides direct physical-memory mapping and I/O-port operations from user mode. Its IOCTL interface exposes physical-memory map and unmap, I/O-port read and write, and physical-address translation primitives that are repeatedly incorporated into BYOVD tooling.
references:
    - https://www.loldrivers.io/drivers/96501e5b-e4f2-41a9-a8ee-d09e36d31a39/
    - https://github.com/magicsword-io/LOLDrivers/issues/222
    - https://github.com/hfiref0x/KDU
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://aka.ms/VulnerableDriverBlockList
author: Michael Haag
date: 2026/04/22
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\winio64.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
