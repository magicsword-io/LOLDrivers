title: Driver Load - cpqsysio64.sys
id: d81b5dee-649d-5702-b54e-00eda8b82b43
status: experimental
description: |
    Detects loading of driver cpqsysio64.sys via name.
    cpqsysio64.sys is a Hewlett-Packard physical-memory driver distributed with ProLiant support and firmware utilities. The tracked 4.5.0.0 and 4.6.0.0 builds handle IOCTL 0x152EF0 by accepting a caller-supplied physical address and length, mapping that range with MmMapIoSpace, and copying from it without constraining the requested physical range. An administrator with device access can read arbitrary physical memory, disclose kernel-sensitive data, and recover addresses that undermine kernel address randomization.
references:
    - https://www.loldrivers.io/drivers/e41d5471-c4b8-48da-bdb7-e462008c2e78/
    - https://github.com/magicsword-io/LOLDrivers/issues/311
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://github.com/KeServiceDescriptorTable/vulnerable-drivers
author: Michael Haag
date: 2026/04/13
modified: 2026/09/08
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\cpqsysio64.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
