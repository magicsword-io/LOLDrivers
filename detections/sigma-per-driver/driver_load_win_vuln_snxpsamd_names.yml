title: Driver Load - snxpsamd.sys
id: d92fef90-19c4-539c-8da4-7565958f88b1
status: experimental
description: |
    Detects loading of driver snxpsamd.sys via name.
    SUNIX Serial Driver x64 version 10.1.0.0 is affected by CVE-2024-55412. This exact signed build exposes raw I/O-port operations to low-privilege callers through IOCTLs including 0x9C403C04 and 0x9C403C08. An attacker can use the unrestricted port read/write primitives to disclose information, tamper with privileged hardware state, and elevate privileges.
references:
    - https://www.loldrivers.io/drivers/300cdb55-6e01-4365-83e5-5783be2f9262/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://nvd.nist.gov/vuln/detail/CVE-2024-55412
    - https://github.com/heyheysky/vulnerable-driver/blob/master/CVE-2024-55412/CVE-2024-55412_snxpsamd.sys_README.md
author: Michael Haag
date: 2026/08/31
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\snxpsamd.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
