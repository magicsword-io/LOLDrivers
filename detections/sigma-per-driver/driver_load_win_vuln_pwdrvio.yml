detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=c32ecb99ad25e9a04f01c8665df29ef8'
            - 'SHA1=c39334f452618af5087f3326758e7f77034f18cf'
            - 'SHA256=0489b3dec6a33e50d8a48a8dad3f5b923a81f7300e4a71358d90d2879bac9aa2'
            - 'IMPHASH=59e66ef22638bfa3854ecf84095d8092'
    condition: selection_hashes
falsepositives:
    - Unknown
level: high
