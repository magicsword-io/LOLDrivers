    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=fc673f2b36cc141869db00db309587d2'
            - 'SHA1=bcab4386a9b39f26ee4ae4672b2e3425337c94aa'
            - 'SHA256=1eaaa7dd2f187a5f25600f6fc6c8f0b905d9e6aeacd0803643ae58367354a513'
            - 'IMPHASH=2219562fa87532a62ce10bd50c4c17be'
    condition: selection_hashes
falsepositives:
    - Unknown
level: high
