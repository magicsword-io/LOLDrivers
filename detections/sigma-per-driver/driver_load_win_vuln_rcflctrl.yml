title: Driver Load - RCFlCtrl.sys
id: 9d77b8c0-e17b-53bd-ad15-9dd688216281
status: experimental
description: |
    Detects loading of driver RCFlCtrl.sys via hash.
    RCFlCtrl.sys, labeled as "RedCastle Control Driver", is a vulnerable kernel driver that can be used to terminate arbitrary processes via IOCTL 0x85000158
references:
    - https://www.loldrivers.io/drivers/a7d2a088-b00b-4f5c-96ca-7a98070dddd5/
    - https://doi.org/10.1016/j.cose.2026.105194
author: Andrea Monzani
date: 2026/10/25
modified: 2026/10/26
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=e53dd75097a7afbb9bdf68713d47df01'
            - 'SHA1=8f0cb2d25448e326f4dcdb0d452b968938383d49'
            - 'SHA256=04bdcd0c70fb07e1c551be3078cf0e82cf53dd4dba3752b74e5db4a715933d16'
            - 'IMPHASH=e6952bf01526fcb4c51de27a2dd72f93'
    condition: selection_hashes
falsepositives:
    - Unknown
level: high
