title: Driver Load - FPCIE2COM.sys
id: 6b223d47-9b76-50a6-9c90-59fabeee0f72
status: experimental
description: |
    Detects loading of driver FPCIE2COM.sys via name.
    FINTEK FPCIE2COM exposes FILE_ANY_ACCESS IOCTLs through \DosDevices\FPCIE2COM that map caller-selected physical addresses for byte reads and writes. It also permits raw PCI configuration access through I/O ports 0xCF8 and 0xCFC, creating privileged hardware-control primitives suitable for kernel or firmware tampering.
references:
    - https://www.loldrivers.io/drivers/9543c507-9b10-4de8-89b9-42a4f24c99ec/
    - https://blogs.vmware.com/security/2023/10/hunting-vulnerable-kernel-drivers.html
    - https://github.com/TakahiroHaruyama/VDR/blob/main/result_firmware.org
    - https://github.com/fluffycats31/vulnerable-drivers
author: Takahiro Haruyama
date: 2023/11/02
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\fpcie2com.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
