title: Driver Load - RtsUpx.sys
id: 91f559ab-f39f-5e79-95b1-11f85de5afe4
status: experimental
description: |
    Detects loading of driver RtsUpx.sys via name.
    Realtek RtsUpx.sys 1.13.0.0 is within the affected range through 1.14.0.0. CVE-2021-36925 permits unauthorized physical-memory read/write through crafted device requests. Related vulnerabilities affect USB device access (CVE-2021-36922), privileged IN/OUT instructions (CVE-2021-36923), and pool memory handling (CVE-2021-36924). Static inspection of this sample confirms caller-controlled physical-memory mapping and copying in the device-control handler.
references:
    - https://www.loldrivers.io/drivers/d1110c3d-3c4c-498e-b9ad-b8874b25841f/
    - https://nvd.nist.gov/vuln/detail/cve-2021-36922
    - https://nvd.nist.gov/vuln/detail/cve-2021-36923
    - https://nvd.nist.gov/vuln/detail/cve-2021-36924
    - https://nvd.nist.gov/vuln/detail/cve-2021-36925
author: Element2023H
date: 2026/10/17
modified: 2026/10/23
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\rtsupx.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
