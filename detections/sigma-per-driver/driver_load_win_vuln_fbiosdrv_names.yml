title: Driver Load - fbiosdrv.sys
id: 1a6c7913-4919-561b-a2d2-00c31ffc0d19
status: experimental
description: |
    Detects loading of driver fbiosdrv.sys via name.
    Fujitsu BIOS Driver versions before 2.5.0.0 are affected by CVE-2025-65001. This signed 2.4.0.0 build creates the \\Device\\FBIOSDRV interface. A specially crafted request from a local authenticated administrator can trigger an out-of-bounds write, potentially causing arbitrary kernel code execution or a denial of service.
references:
    - https://www.loldrivers.io/drivers/dc82ae79-d3e2-439a-a4c7-ec1f23e1261b/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://jvn.jp/en/vu/JVNVU96854657/index.html
    - https://nvd.nist.gov/vuln/detail/CVE-2025-65001
author: Michael Haag
date: 2026/08/31
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\fbiosdrv.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
