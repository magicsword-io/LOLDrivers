title: Driver Load - windrvr1251.sys
id: 589146fd-4def-5c29-81e3-c0511f225a62
status: experimental
description: |
    Detects loading of driver windrvr1251.sys via name.
    Jungo WinDriver versions 6.0.0 through 16.1.0 are affected by multiple kernel security issues fixed in version 16.2.0. The tracked 12.5.1 through 14.1.1 builds fall inside that affected interval. CVE-2024-26314 allows a low-privileged local attacker to escalate privileges and execute arbitrary code. The 14.1.1 driver exposes METHOD_NEITHER requests that reach port I/O, PCI configuration, and mapped-resource operations after the required WinDriver registration workflow.
references:
    - https://www.loldrivers.io/drivers/d2a619bb-c8c6-4c79-8b6a-8368668bbfb2/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://windriver.jungo.com/version/version-16-2-0/
    - https://nvd.nist.gov/vuln/detail/CVE-2023-47569
    - https://nvd.nist.gov/vuln/detail/CVE-2023-47570
    - https://nvd.nist.gov/vuln/detail/CVE-2023-47571
    - https://nvd.nist.gov/vuln/detail/CVE-2023-47572
    - https://nvd.nist.gov/vuln/detail/CVE-2024-26314
    - https://www.cisa.gov/news-events/ics-advisories/icsa-24-135-04
author: Michael Haag
date: 2026/08/31
modified: 2026/09/08
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\windrvr1251.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
