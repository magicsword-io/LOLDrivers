title: Driver Load - PCHunter.sys
id: 223b1060-64d9-5000-bcdc-3390397a3bf7
status: experimental
description: |
    Detects loading of driver PCHunter.sys via hash.
    Epoolsoft Windows Information View Tools
references:
    - https://www.loldrivers.io/drivers/a261cd64-0d04-4bf5-ad73-f3bb96bf83cf/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
author: Michael Haag
date: 2023/01/09
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=c2c1b8c00b99e913d992a870ed478a24'
            - 'SHA1=a64354aac2d68b4fa74b5829a9d42d90d83b040c'
            - 'SHA256=1b7fb154a7b7903a3c81f12f4b094f24a3c60a6a8cffca894c67c264ab7545fa'
            - 'IMPHASH=f510a429c6ce5c8d414550518b3823d2'
    condition: selection_hashes
falsepositives:
    - Unknown
level: high
