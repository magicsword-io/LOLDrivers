title: Driver Load - nipalk.sys
id: b8299bc7-28be-598f-b1d8-ad56f45fb636
status: experimental
description: |
    Detects loading of driver nipalk.sys via hash.
    nipalk.sys is the NI-PAL core kernel driver. The tracked 18.0.0f0 build is within NI-PAL versions before 20.0.1f0 affected by CVE-2021-38304, where improper input validation can allow a local user to escalate privileges. The separately tracked 25.8 build is not attributed to that CVE; exact analysis of that build found physical-memory mapping, virtual-to-physical translation, DMA allocation, bus access, and PCI configuration operations reachable through its IOCTL service gateway.
references:
    - https://www.loldrivers.io/drivers/5ff0ca63-fff8-4c2d-ac04-bb09fc84259f/
    - https://github.com/magicsword-io/LOLDrivers/issues/303
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://www.ni.com/en/support/security/available-critical-and-security-updates-for-ni-software/improper-input-validation-in-ni-pal.html
    - https://nvd.nist.gov/vuln/detail/CVE-2021-38304
