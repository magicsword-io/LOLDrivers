title: Driver Load - aswArPot.sys
id: ae4ea55f-3270-52f2-953b-f22ae450a1b2
status: experimental
description: |
    Detects loading of driver aswArPot.sys via hash.
    Avast and AVG Anti Rootkit driver aswArPot.sys versions before 22.1 are affected by CVE-2022-26522 and CVE-2022-26523. Double-fetch races in kernel handlers allow a non-administrator user to corrupt kernel memory and execute code in kernel context, enabling local privilege escalation and security-product bypass.
references:
    - https://www.loldrivers.io/drivers/57fc510a-e649-4599-b83e-8f3605e3d1d9/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
    - https://github.com/magicsword-io/LOLDrivers/issues/409
