    - https://www.sentinelone.com/labs/vulnerabilities-in-avast-and-avg-put-millions-at-risk/
    - https://nvd.nist.gov/vuln/detail/CVE-2022-26522
    - https://nvd.nist.gov/vuln/detail/CVE-2022-26523
