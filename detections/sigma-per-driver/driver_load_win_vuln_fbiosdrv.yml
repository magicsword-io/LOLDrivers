title: Driver Load - fbiosdrv.sys
id: f0b59d0d-d2b5-52c5-a823-47d5ababd67e
status: experimental
description: |
    Detects loading of driver fbiosdrv.sys via hash.
    Fujitsu BIOS Driver versions before 2.5.0.0 are affected by CVE-2025-65001. The tracked 1.2.1.0 through 2.4.0.0 fBiosDrv.sys builds all precede the fixed release. A crafted request from a local authenticated administrator can trigger an out-of-bounds write, potentially causing arbitrary kernel code execution or denial of service.
