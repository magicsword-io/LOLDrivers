title: Driver Load - NeacSafe64.sys
id: 7c2b7339-c146-5a34-aad9-c108925c61ca
status: experimental
description: |
    Detects loading of driver NeacSafe64.sys via hash.
    NetEase NeacSafe64.sys is an anti-cheat minifilter driver. Public NeacController research documents arbitrary kernel writes (opcode 70) in the 2025-02-20 sample, SHA256 65447f727801e8be8a51aaaafc07618c8196553e683affb0721da441e2430bad, associated with CVE-2025-45737. Separate research on the added 2026 FragPunk, Overwatch China and NARAKA builds reports that opcode 70 has been stubbed, while unauthenticated filter-port messages still expose process termination (opcode 20), process-protection changes (opcode 33), a pool overflow (opcode 52), and a system-crash path (opcode 63). The researcher reports termination and protection stripping of PPL processes. The filter port permits one connection, so an existing client can prevent access. All these builds report version 1.0.0.0 despite differing capabilities; use sample hashes to distinguish them. The older CVE's arbitrary-write claim is not applied to the added samples.
