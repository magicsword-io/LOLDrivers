title: Driver Load - AMDPowerProfiler.sys
id: 30e61fb7-05d3-5f00-b5b9-be23d33b8b8c
status: experimental
description: |
    Detects loading of driver AMDPowerProfiler.sys via name.
    AMD uProf AMDPowerProfiler.sys is affected by CVE-2021-26334. Insufficient access control permits lower-privileged callers to access model-specific registers, which can lead to privilege escalation and ring-0 code execution. AMD addresses the issue in the Windows uProf 3.4.494 release.
references:
    - https://www.loldrivers.io/drivers/9a4fb66e-9084-4b21-9d76-a7afbe330606/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/elastic/protections-artifacts/search?q=VulnDriver
    - https://www.amd.com/en/resources/product-security/bulletin/amd-sb-1016.html
    - https://nvd.nist.gov/vuln/detail/CVE-2021-26334
    - https://github.com/fluffycats31/vulnerable-drivers
author: Michael Haag
date: 2023/01/09
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\amdpowerprofiler.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
