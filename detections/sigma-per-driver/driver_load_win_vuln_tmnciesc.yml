    - https://doi.org/10.1016/j.cose.2026.105194
author: Andrea Monzani
date: 2026/10/25
modified: 2026/10/26
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_hashes:
        Hashes|contains:
            - 'MD5=0e21f1bd9c7eeb87665213810735b56c'
