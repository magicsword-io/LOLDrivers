title: Driver Load - BioNTdrv.sys
id: 1ba9cddb-7e1b-5465-874e-0cf232f2a0e1
status: experimental
description: |
    Detects loading of driver BioNTdrv.sys via name.
    Paragon Hard Disk Manager BioNTdrv.sys versions 10.1.x and older, 1.0.0.0, 1.1.0.0, 1.3.0.0, 1.4.0.0, and 1.5.1.0 contain five vulnerabilities that expose arbitrary kernel-memory mapping, write, and move operations, insecure kernel resource access, and a null-pointer dereference. Local attackers can use the affected driver to elevate to SYSTEM or cause a denial of service. CVE-2025-0289 has been observed in ransomware BYOVD attacks. Version 2.0.0 fixes the flaws.
references:
    - https://www.loldrivers.io/drivers/e6378671-986d-42a1-8e7a-717117c83751/
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://kb.cert.org/vuls/id/726882
    - https://www.sdxcentral.com/alerts/paragon-partition-manager-driver-flaws-enable-privilege-escalation-and-dos-attacks/2025/02/
    - https://www.bleepingcomputer.com/news/security/ransomware-gangs-exploit-paragon-partition-manager-bug-in-byovd-attacks/
    - https://paragon-software.zendesk.com/hc/en-us/articles/32993902732817-IMPORTANT-Paragon-Driver-Security-Patch-for-All-Products-of-Hard-Disk-Manager-Product-Line-Biontdrv-sys
author: Swachchhanda Shrawan Poudel
date: 2025/03/02
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\biontdrv.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
