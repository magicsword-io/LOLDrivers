title: Driver Load - aswArPot.sys
id: cb65e310-153d-5b2e-b89a-528e4ad64a67
status: experimental
description: |
    Detects loading of driver aswArPot.sys via name.
    Avast and AVG Anti Rootkit driver aswArPot.sys versions before 22.1 are affected by CVE-2022-26522 and CVE-2022-26523. Double-fetch races in kernel handlers allow a non-administrator user to corrupt kernel memory and execute code in kernel context, enabling local privilege escalation and security-product bypass.
references:
    - https://www.loldrivers.io/drivers/57fc510a-e649-4599-b83e-8f3605e3d1d9/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
    - https://github.com/magicsword-io/LOLDrivers/issues/409
    - https://github.com/fluffycats31/vulnerable-drivers
    - https://www.sentinelone.com/labs/vulnerabilities-in-avast-and-avg-put-millions-at-risk/
    - https://nvd.nist.gov/vuln/detail/CVE-2022-26522
    - https://nvd.nist.gov/vuln/detail/CVE-2022-26523
author: Michael Haag
date: 2023/01/09
modified: 2026/08/31
tags:
    - attack.privilege_escalation
    - attack.t1543.003
    - attack.t1068
    - loldrivers.vulnerable
logsource:
    product: windows
    category: driver_load
detection:
    selection_name:
        ImageLoaded|endswith:
            - '\aswarpot.sys'
    condition: selection_name
falsepositives:
    - Unknown
level: low
