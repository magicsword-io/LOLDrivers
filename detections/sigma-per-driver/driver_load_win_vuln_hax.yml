title: Driver Load - hax.sys
id: 0207e25f-1a6d-5546-9534-1a4e721ce6d8
status: experimental
description: |
    Detects loading of driver hax.sys via hash.
    Intel Hardware Accelerated Execution Manager versions before 7.7.1 are affected by CVE-2022-21812. The tracked 6.1.0 through 7.7.0 IntelHaxm.sys builds all precede the fixed release. Improper access control on the \Device\GHAX interface allows an authenticated local user to cross the user-to-kernel security boundary and elevate privileges.
